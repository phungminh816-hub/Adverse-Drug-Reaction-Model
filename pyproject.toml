[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr"
version = "0.1.0"
description = "ADR prediction from molecular SMILES – Project 1 HUST 2026-1"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HUST ADR Team"}]

dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "torch",
    "rdkit",
    "streamlit",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
