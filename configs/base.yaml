project:
  name: "adr_project"
  version: "0.1.0"
  seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_splits: "data/splits"
  artifacts: "artifacts"
  results: "results"

data:
  source_url: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/sider.csv.gz"
  raw_filename: "sider.csv.gz"
  processed_filename: "processed.csv"
  label_names_file: "label_names.json"
  split_manifest: "split_manifest.csv"
  smiles_col: "smiles"
  num_labels: 27
  download_timeout_s: 60

  force_download: false

split:
  strategy: "random"
  seed: 42
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10

features:
  fingerprint:
    radius: 2
    n_bits: 2048
    use_chirality: true

training:
  batch_size: 32
  max_epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 8
  optimizer: "adam"
  loss: "bce_with_logits"

  checkpoint_metric: "macro_ap"

inference:
  threshold: 0.5
