model:
  type: "cnn"
  description: "1-branch CNN on character-tokenized SMILES"
  embedding_dim: 64
  channels: 128
  kernel_size: 5
  dropout: 0.2

features:
  tokenizer:
    max_length: 512

    pad_token_id: 0
    unk_token_id: 1

training:
  batch_size: 32
  max_epochs: 50
  learning_rate: 0.001
  early_stopping_patience: 8
  optimizer: "adam"
  loss: "bce_with_logits"
  checkpoint_metric: "macro_ap"
